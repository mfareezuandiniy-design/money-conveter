<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money Converter</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f3f4f6; display: grid; place-items: center; min-height: 100vh; margin: 0; }
  .card { background: #fff; padding: 24px; border-radius: 12px; width: 340px; box-shadow: 0 4px 16px rgba(0,0,0,.1); }
  h2 { margin-top: 0; }
  input, select, button { width: 100%; padding: 10px; margin: 6px 0; font-size: 16px; box-sizing: border-box; }
  button { cursor: pointer; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row select { flex: 1; }
  .row button { width: 48px; }
  #result { font-size: 24px; font-weight: bold; margin: 16px 0 4px; }
  #status { font-size: 12px; color: #6b7280; }
</style>
</head>
<body>
<div class="card">
  <h2>Money Converter</h2>
  <input id="amount" type="number" value="1" min="0" step="any">
  <div class="row">
    <select id="from"></select>
    <button id="swap" title="Tukar">⇄</button>
    <select id="to"></select>
  </div>
  <div id="result">-</div>
  <div id="status">Memuatkan kadar...</div>
</div>

<script>
const API = "https://open.er-api.com/v6/latest/";
const REFRESH_MS = 60_000; // refresh setiap 60 saat

const $ = id => document.getElementById(id);
let rates = {};

async function fetchRates() {
  try {
    const base = $("from").value || "USD";
    const res = await fetch(API + base);
    const data = await res.json();
    if (data.result !== "success") throw new Error("API error");
    rates = data.rates;

    // isi dropdown kali pertama sahaja
    if (!$("from").options.length) populate(Object.keys(rates));

    $("status").textContent = "Dikemas kini: " + new Date().toLocaleTimeString();
    convert();
  } catch (e) {
    $("status").textContent = "Gagal ambil kadar. Cuba lagi sebentar...";
  }
}

function populate(codes) {
  codes.sort();
  for (const sel of [$("from"), $("to")]) {
    sel.innerHTML = codes.map(c => `<option value="${c}">${c}</option>`).join("");
  }
  $("from").value = "USD";
  $("to").value = "MYR";
}

function convert() {
  const amt = parseFloat($("amount").value) || 0;
  const rate = rates[$("to").value];
  if (!rate) return;
  $("result").textContent =
    `${(amt * rate).toLocaleString(undefined, { maximumFractionDigits: 4 })} ${$("to").value}`;
}

$("amount").addEventListener("input", convert);
$("to").addEventListener("change", convert);
$("from").addEventListener("change", fetchRates); // ambil kadar baru ikut base
$("swap").addEventListener("click", () => {
  [$("from").value, $("to").value] = [$("to").value, $("from").value];
  fetchRates();
});

fetchRates();
setInterval(fetchRates, REFRESH_MS);
</script>
</body>
</html>
